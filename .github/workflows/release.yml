name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download Dalamud
        shell: pwsh
        run: |
          $dst = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:TEMP\dalamud.zip"
          Expand-Archive -Force -Path "$env:TEMP\dalamud.zip" -DestinationPath $dst

      - name: Build (Release)
        run: dotnet build BgmSeparator/BgmSeparator.csproj -c Release --nologo

      - name: Test commands and audio state transitions
        run: dotnet run --project tests/BgmSeparator.Tests -c Release

      - name: Regenerate repo.json
        shell: pwsh
        run: pwsh ./scripts/generate-repo.ps1

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BgmSeparator/bin/x64/Release/BgmSeparator/latest.zip

      - name: Commit updated repo.json to main
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          pwsh ./scripts/generate-repo.ps1
          git add repo.json
          if (git status --porcelain repo.json) {
            git commit -m "chore: sync repo.json for ${{ github.ref_name }}"
            git push origin main
          } else {
            Write-Host "repo.json already up to date."
          }
